name: iOS
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - run: npm install --global pnpm@9.15.0
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim --toolchain 1.97.1
      - run: brew install xcodegen
      - name: Host checks (frontend build, fmt, clippy, tests)
        run: pnpm ios:check
      - name: Debug simulator build
        run: pnpm ios:simulator
      - run: pnpm exec playwright install --with-deps webkit chromium
      - name: Browser journeys on the WebKit phone profile
        run: pnpm test:browser --project webkit-phone
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-app
          path: apps/ios/src-tauri/gen/apple/build/arm64-sim/Oxbit.app
          if-no-files-found: ignore
  testflight:
    needs: check
    if: github.ref_type == 'tag'
    runs-on: macos-26
    env:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
    steps:
      - name: Require signing and upload secrets
        run: |
          missing=""
          for name in APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_BASE64 IOS_CERTIFICATE IOS_CERTIFICATE_PASSWORD IOS_MOBILE_PROVISION; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "Skipping the TestFlight upload; missing secrets:$missing"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        id: secrets
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.skip != 'true'
        with:
          node-version: "24.20.0"
      - if: steps.secrets.outputs.skip != 'true'
        run: npm install --global pnpm@9.15.0
      - if: steps.secrets.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.secrets.outputs.skip != 'true'
        run: rustup toolchain install 1.97.1 --profile minimal && rustup target add aarch64-apple-ios --toolchain 1.97.1 && brew install xcodegen
      - name: Write the App Store Connect API key
        if: steps.secrets.outputs.skip != 'true'
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 --decode > "$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"
      - name: Signed build
        if: steps.secrets.outputs.skip != 'true'
        run: pnpm ios:build -- --build-number ${{ github.run_number }}
      - name: Upload to TestFlight
        if: steps.secrets.outputs.skip != 'true'
        run: pnpm ios:upload -- apps/ios/src-tauri/gen/apple/build/arm64/Oxbit.ipa
      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.skip != 'true'
        with:
          name: ios-ipa
          path: apps/ios/src-tauri/gen/apple/build/arm64/Oxbit.ipa
