name: iOS
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim --toolchain 1.97.1
      - run: brew install xcodegen
      - name: Host checks (frontend build, fmt, clippy, tests)
        run: bun run ios:check
      - name: Debug simulator build
        run: bun run ios:simulator
      - run: bunx playwright install --with-deps webkit chromium
      - name: Build runtime and web fixtures for browser journeys
        run: bun run build
      - name: Browser journeys on the WebKit phone profile
        run: bun run test:browser -- --project webkit-phone
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-app
          path: apps/ios/src-tauri/gen/apple/build/arm64-sim/Oxbit.app
          if-no-files-found: ignore
