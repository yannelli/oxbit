name: Desktop
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            platform: darwin-arm64
          - runner: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - run: npm install --global pnpm@9.15.0
      - name: Linux native dependencies (Ubuntu 24.04 minimum)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libfuse2t64 xdg-utils xvfb dbus-x11 weston
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - run: pnpm install --frozen-lockfile
      - name: Browser and CLI regression checks
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm exec playwright install --with-deps chromium
          pnpm test:browser
      - name: Stage runtime and build test-only native app
        run: pnpm desktop:test:build
      - name: Native WebView acceptance (macOS)
        if: runner.os == 'macOS'
        run: pnpm desktop:test:native
      - name: Native WebView acceptance (Linux X11)
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- pnpm desktop:test:native
      - name: Native WebView acceptance (Linux Wayland)
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- node scripts/desktop/wayland.mjs
      - name: Build language WebView fixture
        run: node scripts/language/build-native.mjs
      - name: Language WebView acceptance (macOS)
        if: runner.os == 'macOS'
        run: pnpm exec wdio run tests/desktop/language.conf.mjs
      - name: Language WebView acceptance (Linux X11)
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- pnpm exec wdio run tests/desktop/language.conf.mjs
      - name: Preserve language WebView evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: language-webview-${{ matrix.platform }}
          path: evidence/language-milestone1/native/
      - name: Rust formatting, Clippy, and tests
        run: pnpm desktop:check
      - name: Import Developer ID certificate
        if: github.ref_type == 'tag' && runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Build unsigned pull-request artifacts
        if: github.ref_type != 'tag'
        run: pnpm desktop:build
      - name: Build signed release artifacts
        if: github.ref_type == 'tag'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OXBIT_UPDATER_PUBLIC_KEY: ${{ vars.OXBIT_UPDATER_PUBLIC_KEY }}
        run: pnpm desktop:release
      - name: Installed Linux package smoke checks
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          xvfb-run -a dbus-run-session -- pnpm desktop:test:installed /usr/bin/oxbit-desktop
          oxbit_deb_package=$(dpkg-deb --field apps/desktop/src-tauri/target/release/bundle/deb/*.deb Package)
          sudo apt-get remove -y "$oxbit_deb_package"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a dbus-run-session -- node scripts/desktop/installed-smoke.mjs "$(realpath apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage)"
      - name: Notarize, staple, and assess the final DMG
        if: github.ref_type == 'tag' && runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/desktop/notarize.mjs
      - name: Upload installable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/**/*.sig
            apps/desktop/src-tauri/resources/runtime/inventory.json
          if-no-files-found: error
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-evidence-${{ matrix.platform }}
          path: apps/desktop/native-results/
          if-no-files-found: ignore
  draft-release:
    needs: build
    if: github.ref_type == 'tag' && github.repository == 'yannelli/oxbit'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: desktop-artifacts
      - name: Create draft and upload binaries before updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ github.ref_name }}
        run: node scripts/desktop/draft-release.mjs
