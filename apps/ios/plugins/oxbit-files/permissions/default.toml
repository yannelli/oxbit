"$schema" = "schemas/schema.json"

[default]
description = "Pick Files app folders and files, reopen folders from bookmarks, locate the Documents directory, list SSH key metadata, find Oxbit runtimes on the local network, dictate text with speech recognition, and show agent turns as a Live Activity."
permissions = [
  "allow-pick-folder",
  "allow-open-folder",
  "allow-close-folder",
  "allow-forget-folder",
  "allow-documents-path",
  "allow-runtime-credentials",
  "allow-runtime-discovery",
  "allow-git-credentials",
  "allow-ssh-keys",
  "allow-pick-files",
  "allow-commit-signing",
  "allow-start-dictation",
  "allow-stop-dictation",
  "allow-live-activity",
]
