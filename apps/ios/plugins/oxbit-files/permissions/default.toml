"$schema" = "schemas/schema.json"

[default]
description = "Pick Files app folders and files, reopen folders from bookmarks, locate the Documents directory, list SSH key metadata, and find Oxbit runtimes on the local network."
permissions = [
  "allow-pick-folder",
  "allow-open-folder",
  "allow-close-folder",
  "allow-forget-folder",
  "allow-documents-path",
  "allow-runtime-credentials",
  "allow-runtime-discovery",
  "allow-git-credentials",
  "allow-ssh-keys",
  "allow-pick-files",
  "allow-commit-signing",
]
