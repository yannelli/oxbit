"$schema" = "schemas/schema.json"

[default]
description = "Pick Files app folders and files, reopen folders from bookmarks, locate the Documents directory, list SSH key metadata, find Oxbit runtimes on the local network, dictate text with speech recognition, show agent turns as a Live Activity and report its push tokens, post agent notifications and report taps on them, register for remote notifications, send model API requests for the in-app agent with an API key or ChatGPT sign-in kept in Keychain, and run coarse background location updates that keep connections open when the user turns that on."
permissions = [
  "allow-pick-folder",
  "allow-open-folder",
  "allow-close-folder",
  "allow-forget-folder",
  "allow-documents-path",
  "allow-runtime-credentials",
  "allow-runtime-discovery",
  "allow-git-credentials",
  "allow-ssh-keys",
  "allow-pick-files",
  "allow-commit-signing",
  "allow-start-dictation",
  "allow-stop-dictation",
  "allow-live-activity",
  "allow-watch-live-activity-tokens",
  "allow-unwatch-live-activity-tokens",
  "allow-notification-permission",
  "allow-request-notification-permission",
  "allow-notify",
  "allow-watch-notification-taps",
  "allow-unwatch-notification-taps",
  "allow-register-remote-notifications",
  "allow-agent-models-stream",
  "allow-agent-models-cancel",
  "allow-agent-models-key",
  "allow-agent-models-chatgpt",
  "allow-background-location",
]
