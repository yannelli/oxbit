[package]
name = "tauri-plugin-oxbit-files"
version = "0.1.0"
description = "Files app folder access for Oxbit on iOS"
authors = ["Ryan Yannelli"]
edition = "2021"
rust-version = "1.97.1"
license = "MIT"
links = "tauri-plugin-oxbit-files"

[build-dependencies]
tauri-plugin = { version = "=2.6.3", features = ["build"] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
