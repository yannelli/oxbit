[package]
name = "oxbit-ios"
version = "0.2.4"
description = "Oxbit workbench for iOS and iPadOS"
authors = ["Ryan Yannelli"]
edition = "2021"
rust-version = "1.97.1"
license = "MIT"

[lib]
name = "oxbit_ios_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-opener = "=2.5.5"
tauri-plugin-clipboard-manager = "=2.3.3"
tauri-plugin-oxbit-files = { path = "../plugins/oxbit-files" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = "none"
lto = true
codegen-units = 1
panic = "unwind"

# Upstream's Xcode 27 fix promotes each package's own @_cdecl symbols and skips the
# shared SwiftRs.o member, so _retain_object, _release_object and _string_from_bytes
# stay local and the arm64 link fails. See apps/ios/vendor/swift-rs/src-rs/build.rs.
[patch.crates-io]
swift-rs = { path = "../vendor/swift-rs" }
# tao 0.35.3 returns Retained::as_ptr from
# application:configurationForConnectingSceneSession:options: and drops the Retained,
# so UIKit retains a released UISceneConfiguration and the app segfaults on launch.
# Only reached when Info.ios.plist sets UIApplicationSupportsMultipleScenes.
# Fixed upstream in 0.36.0; drop this once tauri-runtime-wry takes tao 0.36.
tao = { path = "../vendor/tao" }
