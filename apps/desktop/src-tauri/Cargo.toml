[package]
name = "oxbit-desktop"
version = "0.1.0"
description = "Oxbit desktop workbench"
authors = ["Ryan Yannelli"]
edition = "2021"
rust-version = "1.97.1"
license = "MIT"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
native-test = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver", "dep:objc2-foundation"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-updater = "=2.11.0"
tauri-plugin-single-instance = "=2.4.4"
tauri-plugin-clipboard-manager = "=2.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
tauri-plugin-wdio = { version = "=1.4.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.4.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-web-kit = "=0.3.2"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSTextCheckingClient"] }
objc2-foundation = { version = "=0.3.2", optional = true }

[profile.release]
strip = "none" # Preserve proc-macro metadata with the pinned Rust toolchain.
lto = true
codegen-units = 1
panic = "unwind"
